name: "Build"

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'
      - '.github/project.yml'
  pull_request:
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - '*.md'
      - '*.adoc'
      - '*.txt'

env:
  LANG: en_US.UTF-8
  MAVEN_ARGS: "-Dformat.skip"
jobs:
  build:
    name: JVM Tests - JDK ${{matrix.java-version}} ${{matrix.distribution}} ${{matrix.os-name}}
    runs-on: ${{ matrix.os-name }}
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21, 25]
        distribution: [temurin, zulu, liberica, semeru]
        os-name: [ubuntu-latest]
        include:
          # Temurin on Windows - stable versions
          - { java-version: 17, distribution: temurin, os-name: windows-latest }
          - { java-version: 21, distribution: temurin, os-name: windows-latest }
          - { java-version: 25, distribution: temurin, os-name: windows-latest }
          # Temurin on macOS - stable versions
          - { java-version: 17, distribution: temurin, os-name: macos-latest }
          - { java-version: 21, distribution: temurin, os-name: macos-latest }
          - { java-version: 25, distribution: temurin, os-name: macos-latest }
          # Java 26 - latest, added explicitly per vendor as availability allows
          - { java-version: 26, distribution: temurin, os-name: ubuntu-latest }
          - { java-version: 26, distribution: temurin, os-name: windows-latest }
          - { java-version: 26, distribution: temurin, os-name: macos-latest }
          - { java-version: 26, distribution: zulu, os-name: ubuntu-latest }
          - { java-version: 26, distribution: liberica, os-name: ubuntu-latest }
          - { java-version: 26, distribution: semeru, os-name: ubuntu-latest }
    steps:
      - uses: actions/checkout@v6
      - name: Install JDK ${{ matrix.java-version }} ${{ matrix.distribution }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}
          cache: maven
      - name: Build with Maven
        run: mvn -B clean install $MAVEN_ARGS
      - name: Delete Local Artifacts From Cache
        shell: bash
        run: rm -rf ~/.m2/repository/io/quarkus/quarkus-fs-util*
